<body class="bg-cream-surface-95 text-light-on-surface font-body antialiased">
  <div class="min-h-screen w-full max-w-[390px] mx-auto bg-light-on-surface/15 flex flex-col justify-end">

            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
          <h1 data-design-text-token="title-lg" class="font-title text-title-lg text-light-on-surface">직접 입력</h1>
          <span data-design-text-token="label-sm" class="font-label text-label-sm px-gutter-sm py-gutter-xs rounded-full bg-apricot-soft-95 text-light-secondary">11월 28일</span>
        </header>

        <!-- Manual Entry Form -->
        <section class="rounded-xl bg-light-surface-container-lowest border border-light-outline-variant/40 p-gutter-lg flex flex-col gap-gutter-lg">
          <div class="grid grid-cols-2 rounded-full bg-cream-surface-95 p-gutter-xs">
            <button type="button" class="py-gutter-sm rounded-full bg-apricot-soft-95 text-light-secondary font-label text-label-lg">
              <span data-design-text-token="label-lg">지출</span>
            </button>
            <button type="button" class="py-gutter-sm rounded-full text-light-on-surface-variant font-label text-label-lg">
              <span data-design-text-token="label-lg">수입</span>
            </button>
          </div>

          <label class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface-variant">금액</span>
            <div class="flex items-center justify-between rounded-md border border-light-outline-variant/60 bg-cream-surface-99 px-gutter-md py-gutter-sm">
              <span data-design-text-token="title-lg" class="font-headline text-title-lg text-light-on-surface-variant">₩</span>
              <input type="text" placeholder="0" inputmode="numeric" aria-label="금액" class="w-full border-0 bg-transparent p-0 text-right font-headline text-headline-md text-light-on-surface placeholder:text-light-on-surface-variant tabular-nums focus:ring-0">
            </div>
          </label>

          <label class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface-variant">메모</span>
            <input type="text" placeholder="예: 저녁 장보기" aria-label="메모" class="w-full rounded-md border border-light-outline-variant/60 bg-cream-surface-99 px-gutter-md py-gutter-sm font-body text-body-lg text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </label>

          <div class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface-variant">카테고리</span>
            <div class="flex flex-wrap gap-gutter-xs">
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-light-primary text-light-on-primary font-label text-label-md">식비</button>
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-cream-surface-95 text-light-on-surface-variant font-label text-label-md">카페</button>
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-cream-surface-95 text-light-on-surface-variant font-label text-label-md">교통</button>
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-cream-surface-95 text-light-on-surface-variant font-label text-label-md">쇼핑</button>
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-cream-surface-95 text-light-on-surface-variant font-label text-label-md">생활</button>
              <button type="button" class="px-gutter-md py-gutter-xs rounded-full bg-cream-surface-95 text-light-on-surface-variant font-label text-label-md">기타</button>
            </div>
          </div>

          <div class="flex items-center justify-between pt-gutter-sm border-t border-light-outline-variant/30">
            <div class="flex items-center gap-gutter-xs">

              <span class="w-5 h-5 rounded-full bg-light-surface-container-lowest shadow-sm"></span>
            </span>
          </div>
        </section>
      </main>

      <!-- Save CTA -->
      <footer class="px-page-margin pt-gutter-lg">
        <button type="button" class="w-full py-gutter-md rounded-full bg-light-primary text-light-on-primary font-label text-label-lg flex items-center justify-center gap-gutter-xs">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">check_circle</span>
          <span data-design-text-token="label-lg">저장하기</span>
        </button>
      </footer>
    </div>
  </div>
