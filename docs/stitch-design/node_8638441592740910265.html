<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OwlLog · 애플 워치 UI 리디자인</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cream-bg': '#FBF9F4',
            'watch-oled': '#000000',
            'watch-card': '#161D19',
            'mint': '#8AD5BD',
            'mint-deep': '#00382C',
            'apricot': '#FFB598',
            'ink': '#161D19',
            'muted': '#5B6862'
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-cream-bg text-ink font-sans antialiased p-7">
  <div class="max-w-[764px] mx-auto space-y-5">
    <div class="flex items-center justify-between">
      <div>
        <span class="inline-block px-2.5 py-0.5 rounded-full bg-[#E1F5EE] text-[#005644] text-[11px] font-semibold mb-1">watchOS Companion · 리디자인</span>
        <h2 class="text-[18px] font-bold tracking-tight text-ink">OwlLog 애플 워치 3단계 플로우</h2>
      </div>
      <span class="text-[12px] text-muted">한 손 원탭 음성 기록 → AI 정리 → 오늘 요약</span>
    </div>

    <div class="grid grid-cols-3 gap-6">
      <!-- Watch 1: Home / Quick Voice Capture -->
      <div class="flex flex-col items-center gap-3">
        <div class="w-[216px] h-[264px] rounded-[46px] bg-[#1C1F1E] p-2.5 shadow-lg relative">
          <div class="w-full h-full rounded-[38px] bg-watch-oled text-white p-3.5 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-bold text-mint">OwlLog</span>
              <span class="font-semibold tabular-nums">01:50</span>
            </div>

            <div class="flex flex-col items-center gap-2 my-1">
              <button type="button" class="w-20 h-20 rounded-full bg-mint text-mint-deep flex flex-col items-center justify-center shadow-md">
                <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mic</span>
                <span class="text-[10px] font-bold mt-0.5">말하기</span>
              </button>
              <span class="text-[10px] text-[#BEC9C3]">예: “커피 4500원”</span>
            </div>

            <div class="grid grid-cols-2 gap-1.5">
              <button type="button" class="py-1.5 px-2 rounded-full bg-watch-card border border-white/10 text-[10px] font-semibold text-white truncate">라테 4,500</button>
              <button type="button" class="py-1.5 px-2 rounded-full bg-watch-card border border-white/10 text-[10px] font-semibold text-white truncate">점심 9,000</button>
            </div>
          </div>
        </div>
        <p class="text-[12px] font-semibold text-ink">1. 원탭 말하기 &amp; 즐겨찾기</p>
      </div>

      <!-- Watch 2: AI Parse & Confirm -->
      <div class="flex flex-col items-center gap-3">
        <div class="w-[216px] h-[264px] rounded-[46px] bg-[#1C1F1E] p-2.5 shadow-lg relative">
          <div class="w-full h-full rounded-[38px] bg-watch-oled text-white p-3.5 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-semibold text-mint flex items-center gap-1">
                <span class="material-symbols-outlined text-[13px]">auto_awesome</span>
                AI 정리
              </span>
              <span class="font-semibold tabular-nums">01:51</span>
            </div>

            <div class="rounded-2xl bg-watch-card border border-mint/30 p-3 flex flex-col gap-1">
              <span class="text-[10px] text-[#BEC9C3]">카페 · 11월 28일</span>
              <span class="text-[14px] font-bold text-white">아이스 커피</span>
              <span class="text-[18px] font-bold text-apricot tabular-nums">−₩4,500</span>
            </div>

            <div class="grid grid-cols-3 gap-1.5">
              <button type="button" class="col-span-1 py-2 rounded-full bg-watch-card text-[11px] font-semibold text-[#BEC9C3]">수정</button>
              <button type="button" class="col-span-2 py-2 rounded-full bg-mint text-mint-deep text-[11px] font-bold">저장</button>
            </div>
          </div>
        </div>
        <p class="text-[12px] font-semibold text-ink">2. AI 정리 확인 · 즉시 저장</p>
      </div>

      <!-- Watch 3: Today Summary & Sync Status -->
      <div class="flex flex-col items-center gap-3">
        <div class="w-[216px] h-[264px] rounded-[46px] bg-[#1C1F1E] p-2.5 shadow-lg relative">
          <div class="w-full h-full rounded-[38px] bg-watch-oled text-white p-3.5 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-semibold text-[#BEC9C3]">오늘 현황</span>
              <span class="font-semibold tabular-nums">01:51</span>
            </div>

            <div class="rounded-2xl bg-watch-card p-3 space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-[10px] text-[#BEC9C3]">오늘 지출</span>
                <span class="text-[10px] text-mint font-semibold">예산 92%</span>
              </div>
              <div class="text-[20px] font-bold tabular-nums text-white">₩13,500</div>
              <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                <div class="h-full w-11/12 rounded-full bg-mint"></div>
              </div>
            </div>

            <div class="flex items-center justify-between px-2 py-1.5 rounded-full bg-watch-card text-[10px] text-mint">
              <span class="flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-mint"></span>
                iPhone 동기화됨
              </span>
              <span class="text-[#BEC9C3]">2건</span>
            </div>
          </div>
        </div>
        <p class="text-[12px] font-semibold text-ink">3. 오늘 지출 &amp; 동기화 상태</p>
      </div>
    </div>
  </div>
</body>
</html>
