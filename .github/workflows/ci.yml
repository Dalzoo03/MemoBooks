name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Logic, Watch outbox and SwiftData checks
        run: ./Tools/check.sh
      - name: Build iPhone and embedded Watch app
        run: >-
          xcodebuild -quiet -project MemoBooks.xcodeproj -scheme MemoBooks
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MemoBooksBuild" CODE_SIGNING_ALLOWED=NO build
